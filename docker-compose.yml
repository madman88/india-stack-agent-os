services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev:web"
    environment:
      MOCK_API_TARGET: http://mock-api:8787
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    depends_on:
      - mock-api

  mock-api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev:api"
    environment:
      PORT: "8787"
      DB_DRIVER: dynamodb
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PROOF_CHAIN_TABLE: agent-os-proof-chain
      BUSINESS_STATE_TABLE: agent-os-business-state
      APPROVALS_TABLE: agent-os-approvals
    ports:
      - "8787:8787"
    volumes:
      - .:/app
    depends_on:
      - localstack

  localstack:
    image: localstack/localstack:3.8
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs,dynamodb,secretsmanager
      DEBUG: "0"
    volumes:
      - localstack-data:/var/lib/localstack

volumes:
  localstack-data:
